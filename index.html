
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITH FB AUTO</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }
    header {
      background: #1877f2;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0001;
    }
    button {
      background: #1877f2;
      color: white;
      border: 0;
      padding: 13px;
      border-radius: 8px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>RITH FB AUTO</h1>
    <p>Facebook Registration Assistant</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to RITH</h2>
      <p>Registration Assistant</p>
      <p>Step 1: Prepare your personal information.</p>
      <p>Step 2: Open the official Facebook registration page.</p>
      <button onclick="window.open(
        'https://www.facebook.com/reg/',
        '_blank'
      )">
        Start Registration
      </button>
    </div>
  </main>
</body>
</html>
