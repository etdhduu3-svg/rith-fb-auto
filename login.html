
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RITH ADMIN LOGIN</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh}
.box{background:#151e35;padding:30px;border-radius:16px;width:85%;max-width:350px}
h2{color:#38bdf8;text-align:center}
input{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;border:0;border-radius:8px}
button{width:100%;padding:13px;background:#0284c7;color:white;border:0;border-radius:8px;margin-top:12px}
#message{text-align:center;color:#fbbf24}
</style>
</head>
<body>
<div class="box">
<h2>RITH ADMIN</h2>
<input id="username" placeholder="Admin Username" autocomplete="username">
<input id="password" type="password" placeholder="Admin Password" autocomplete="current-password">
<button onclick="login()">LOGIN</button>
<p id="message"></p>
</div>
<script>
async function login(){
 const message=document.getElementById("message");
 message.textContent="Checking...";
 try{
  const response=await fetch("https://rith-api-server.onrender.com/api/admin/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    username:document.getElementById("username").value,
    password:document.getElementById("password").value
   })
  });
  const data=await response.json();
  if(data.success){
   sessionStorage.setItem("rith_admin_token",data.token);
   message.textContent="Login successful!";
   location.href="dashboard.html";
  }else{
   message.textContent=data.message||"Login failed";
  }
 }catch(error){
  message.textContent="Server connection error";
 }
}
</script>
</body>
</html>
